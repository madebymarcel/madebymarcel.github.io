version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Angular 22.3 supports TypeScript >=6.0 <6.1; revisit after upgrading Angular.
      - dependency-name: typescript
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
