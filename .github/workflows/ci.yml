name: CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Full regression every night at 02:23 UTC; never publishes the site.
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'regular' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: ${{ steps.pages-name.outputs.name }}
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    container:
      # Update this tag together with @playwright/test in package.json and package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Determine test impact
        id: impact
        run: node scripts/test-impact.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
        id: format
      - name: Show formatting differences
        if: failure() && steps.format.outcome == 'failure'
        run: |
          npm run format
          git diff --exit-code
      - run: npm run test:unit
      - run: npm run build
      - name: Use Playwright Chromium for Lighthouse
        if: steps.impact.outputs.lighthouse == 'true'
        shell: bash
        run: |
          chrome="$(node -p "require('@playwright/test').chromium.executablePath()")"
          if [[ ! -x "$chrome" ]]; then
            echo "::error::Chromium not found. Match the Playwright container tag to @playwright/test."
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Run affected browser tests
        shell: bash
        env:
          TEST_MODE: ${{ steps.impact.outputs.mode }}
          TEST_FILES: ${{ steps.impact.outputs.files }}
          PLAYWRIGHT_PREBUILT: '1'
        run: |
          if [[ "$TEST_MODE" == "affected" || "$TEST_MODE" == "smoke" ]]; then
            read -r -a files <<< "$TEST_FILES"
            if (( ${#files[@]} == 0 )); then
              echo "::error::Impact selector returned no browser tests."
              exit 1
            fi
            npm run test:e2e -- "${files[@]}"
          else
            npm run test:e2e
          fi
      - run: npm run lighthouse
        if: steps.impact.outputs.lighthouse == 'true'
      - run: npx lhci autorun --config=./lighthouserc.mobile.cjs
        if: steps.impact.outputs.lighthouse == 'true'
      - name: Name validated Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: pages-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages-name.outputs.name != ''
        id: pages-artifact
        with:
          name: ${{ steps.pages-name.outputs.name }}
          path: dist/portfolio/browser
      - name: Upload test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: ${{ needs.validate.outputs.pages_artifact_name }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Wait for Pages artifact availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.validate.outputs.pages_artifact_id }}
        run: |
          # Artifact upload and artifact listing can become consistent at different times.
          # Match the exact artifact ID and name; a retry must not pick up a previous attempt.
          for attempt in {1..12}; do
            if artifact_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts | map(select(.expired == false)) | if length == 1 then .[0].id else empty end')" \
              && [[ -n "$PAGES_ARTIFACT_ID" && "$artifact_id" == "$PAGES_ARTIFACT_ID" ]]; then
              echo "Pages artifact $artifact_id is available."
              # Allow the Pages action's artifact service to converge as well.
              sleep 5
              exit 0
            fi
            echo "Pages artifact not yet available (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::Uploaded Pages artifact did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
