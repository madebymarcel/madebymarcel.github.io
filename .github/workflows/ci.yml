name: CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format Angular foundation for bootstrap
        run: |
          npx prettier --write .
          node -e "const fs=require('node:fs');for(const p of [\"eslint.config.mjs\",\"playwright.config.mjs\",\"README.md\",\"src/app/app.routes.ts\",\"src/app/features/about/about-page.ts\",\"src/app/features/experience/experience-page.ts\",\"src/app/features/home/home-page.html\",\"src/app/features/lab/lab-page.ts\",\"src/app/layout/site-footer/site-footer.ts\",\"src/app/layout/site-header/site-header.html\",\"src/styles.scss\"]){console.log('FORMATTED_FILE:'+p);console.log(fs.readFileSync(p).toString('base64'));console.log('FORMATTED_END')}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lighthouse
      - name: Upload test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/portfolio/browser
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
