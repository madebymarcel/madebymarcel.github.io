name: CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    container:
      # Update this tag together with @playwright/test in package.json and package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - name: Use Playwright Chromium for Lighthouse
        shell: bash
        run: |
          chrome="$(node -p "require('@playwright/test').chromium.executablePath()")"
          if [[ ! -x "$chrome" ]]; then
            echo "::error::Chromium not found. Match the Playwright container tag to @playwright/test."
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - run: npm run lighthouse
      - run: npx lhci autorun --config=./lighthouserc.mobile.cjs
      - name: Upload test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install production build dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist/portfolio/browser
      - name: Wait for Pages artifact availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          # Artifact upload and artifact listing can become consistent at different times.
          # Match the exact artifact ID and name; a retry must not pick up a previous attempt.
          for attempt in {1..12}; do
            if artifact_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts | map(select(.expired == false)) | if length == 1 then .[0].id else empty end')" \
              && [[ -n "$PAGES_ARTIFACT_ID" && "$artifact_id" == "$PAGES_ARTIFACT_ID" ]]; then
              echo "Pages artifact $artifact_id is available."
              # Allow the Pages action's artifact service to converge as well.
              sleep 5
              exit 0
            fi
            echo "Pages artifact not yet available (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::Uploaded Pages artifact did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
