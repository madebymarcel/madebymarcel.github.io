name: Rex gait diagnostics (experiment only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/rex-gait-diagnostics.mjs'
      - '.github/workflows/rex-gait-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.head_ref == 'experiment/trex-gait-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only the locked physics dependency
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/cannon-es'].version")
          npm install --prefix "$RUNNER_TEMP/rex-deps" "cannon-es@$VERSION" --no-audit --no-fund --ignore-scripts
          ln -s "$RUNNER_TEMP/rex-deps/node_modules" node_modules
      - name: Reproduce and compare isolated hypotheses
        run: node scripts/rex-gait-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rex-gait-diagnostics
          path: rex-diagnostic-results.json
          if-no-files-found: ignore
