  <style>
:root {
  --theme-duration: 650ms;
  --switch-duration: 250ms;
  --page-background: var(--paint-page-bg-color, #ffffff);
  --page-text: CanvasText;
  color-scheme: light;
  font-family: system-ui, sans-serif;
  color: var(--page-text);
  background: var(--page-background);
  transition-duration: var(--theme-duration);
  transition-timing-function: ease-in-out;
}

:root[data-theme="night"] { color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; }
main { background: var(--page-background); }
button {
  -webkit-tap-highlight-color: transparent;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 3px solid #fedbaf;
  outline-offset: 5px;
}

.scene-stage {
  position: relative;
  width: 100%;
  height: max(100svh, var(--scene-min-height, 704px));
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--page-background);
}
.scene-frame {
  width: 100%;
  height: 100%;
  min-width: 0;
  overflow: hidden;
}
.scene-frame > svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.scene-controls {
  display: flex;
  justify-content: flex-end;
  padding: 1rem;
}
.theme-switch {
  position: relative;
  display: block;
  width: 4.5rem;
  height: 2.75rem;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--paint-dark-violet) 45%, transparent);
  border-radius: 999px;
  background: var(--paint-peach);
  color: var(--paint-cream);
  box-shadow: 0 2px 8px #00000020;
}
.theme-switch:hover { box-shadow: 0 2px 10px #00000040; }
.theme-switch:focus-visible { outline-color: Highlight; }
.theme-switch__thumb {
  position: absolute;
  top: 0.25rem;
  left: 0.25rem;
  width: 2.125rem;
  height: 2.125rem;
  border-radius: 50%;
  background: var(--paint-cream);
  box-shadow: 0 2px 5px #00000030;
  transition: transform var(--switch-duration) ease-in-out;
}
.theme-switch[aria-checked="true"] .theme-switch__thumb { transform: translateX(1.75rem); }
.theme-switch__sun, .theme-switch__moon {
  position: absolute;
  top: 0.8125rem;
  width: 1rem;
  height: 1rem;
  border-radius: 50%;
}
.theme-switch__sun { left: 0.8125rem; border: 2px dotted currentColor; }
.theme-switch__sun::before { content: ""; position: absolute; inset: 0.125rem; border-radius: 50%; background: currentColor; }
.theme-switch__moon { right: 0.8125rem; box-shadow: inset -0.3rem -0.1rem 0 currentColor; transform: rotate(-20deg); }

.page-spacer {
  position: relative;
  z-index: 1;
  height: 200vh;
  background: var(--page-background);
}
@media (prefers-reduced-motion: reduce) {
  :root { --theme-duration: 0ms; --switch-duration: 0ms; }
}
  </style>
</head>

// Scene behavior. No dependencies or external files are needed.
const artworkFrame = document.querySelector(".scene-frame");
const svg = artworkFrame.querySelector("svg");
const sceneHeight = svg.viewBox.baseVal.height;
const sceneWidth = svg.viewBox.baseVal.width;
const sky = svg.querySelector("#sky");
const skyBounds = Object.fromEntries(["x", "y", "width", "height"].map(name => [name, sky.getAttribute(name)]));
let visibleSceneHeight = sceneHeight;
const artwork = svg.querySelector("#g1");
const section = document.querySelector(".scene-scroll");
const stage = document.querySelector(".scene-stage");
const page = document.querySelector("main");
const themeToggle = document.querySelector("#theme-toggle");
const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
// Artwork colors are always opaque, including accidental #RGBA/#RRGGBBAA edits.
const opaqueColor = color => color
  .replace(/^(#[\da-f]{6})[\da-f]{2}$/i, "$1")
  .replace(/^(#[\da-f]{3})[\da-f]$/i, "$1");
const colors = palette.map(group => ({
  ...group,
  day: opaqueColor(group.day),
  night: opaqueColor(group.night),
}));

// Preserve the source order and every existing transform. Animation belongs to
// new outer groups; the original layer nodes are never translated directly.
const cloudDirections = {
  "cloud-1": -1, "cloud-2": -1, "cloud-3": -1, "cloud-4": -1,
  "cloud-5": 1, "cloud-6": 1, "cloud-7": 1,
};
const cloudDrift = clamp(parallaxSettings.cloudDrift ?? 0, 0, 1);
const layers = Array.from(artwork.children, (element) => {
  const id = element.id;
  if (!(id in parallaxDepth)) throw new Error(`Missing depth for ${id}`);
  const wrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
  wrapper.dataset.parallaxLayer = id;
  const composition = document.createElementNS("http://www.w3.org/2000/svg", "g");
  composition.dataset.compositionLayer = id;
  element.before(wrapper);
  wrapper.append(composition);
  composition.append(element);
  return { wrapper, composition, id, depth: clamp(parallaxDepth[id], 0, 1), driftDirection: cloudDirections[id] ?? 0, lastOffset: 0, lastOffsetX: 0, lastLayout: "" };
});
// One shared browser timeline keeps all layers synchronized with native
// scrolling, including when JavaScript animation frames are delayed.
const scrollTimeline = globalThis.ScrollTimeline && CSS.supports("animation-range: 0px 1px")
  ? new ScrollTimeline({ source: document.scrollingElement, axis: "block" }) : null;

page.style.setProperty("--scene-min-height", `${sceneComposition.minHeight}px`);

function arrange(width, height) {
  // A uniform cover scale fills the fixed-height scene. A narrower camera
  // recomposes horizontally; a wider one brings vertical features into frame.
  const cameraScale = Math.max(width / sceneWidth, height / sceneHeight);
  const cameraWidth = width / cameraScale;
  const cameraHeight = height / cameraScale;
  visibleSceneHeight = cameraHeight;
  const left = (sceneWidth - cameraWidth) / 2;
  const compact = clamp((sceneWidth - cameraWidth) / (sceneWidth - sceneComposition.compactWidth), 0, 1);
  const viewBox = `${left} 0 ${cameraWidth} ${cameraHeight}`;
  if (svg.getAttribute("viewBox") !== viewBox) svg.setAttribute("viewBox", viewBox);
  for (const layer of layers) {
    const rule = sceneComposition.layers[layer.id];
    if (!rule) continue;
    const anchor = rule.focusX / sceneWidth * (1 - compact) + rule.compactAnchor * compact;
    const scale = 1 + ((rule.compactScale ?? 1) - 1) * compact;
    let targetX = left + cameraWidth * anchor;
    if (rule.leftEdge !== undefined) targetX = Math.max(targetX, left + 8 - scale * (rule.leftEdge - rule.focusX));
    // Some terrain ends at a vertical cut formerly hidden by the right cliff.
    // Keep that cut outside the camera while the uninteresting cliff exits.
    if (rule.rightEdge !== undefined && compact > 0) {
      const reveal = Math.min(1, compact * 3);
      const edge = rule.rightEdge + (left + cameraWidth - rule.rightEdge) * reveal;
      targetX = Math.max(targetX, edge - scale * (rule.rightEdge - rule.focusX) + reveal);
    }
    const x = targetX - scale * rule.focusX;
    const y = (rule.anchorY ?? sceneHeight) * (1 - scale)
      + (cameraHeight / sceneHeight - 1) * (rule.focusY ?? sceneHeight)
      + (rule.compactOffsetY ?? 0) * compact;
    const identity = Math.abs(scale - 1) < 1e-8 && Math.abs(x) < 1e-8 && Math.abs(y) < 1e-8;
    const transform = identity ? "" : `matrix(${scale} 0 0 ${scale} ${x} ${y})`;
    if (transform === layer.lastLayout) continue;
    if (transform) layer.composition.setAttribute("transform", transform);
    else layer.composition.removeAttribute("transform");
    layer.lastLayout = transform;
  }
  // Keep the original paint coordinates. On browsers without scroll timelines,
  // extend only the upper edge so delayed RAF updates cannot uncover the page.
  const reference = Math.abs(cameraWidth - sceneWidth) < 1e-6 && Math.abs(cameraHeight - sceneHeight) < 1e-6;
  const bounds = reference ? { ...skyBounds } : { ...skyBounds, x: Math.min(Number(skyBounds.x), left - 1), width: Math.max(Number(skyBounds.width), cameraWidth + 2), height: cameraHeight };
  if (!scrollTimeline && !motionPreference.matches) {
    bounds.y = Number(bounds.y) - cameraHeight;
    bounds.height = Number(bounds.height) + cameraHeight;
  }
  for (const [name, value] of Object.entries(bounds)) {
    if (sky.getAttribute(name) !== String(value)) sky.setAttribute(name, value);
  }
}

let isNight = false;
// Typed color variables animate fills, gradient stops, and the page backdrop
// together. The browser handles interpolation independently of scroll motion.
if (globalThis.CSS?.registerProperty) {
  const properties = [
    ...colors.map(({ id, day }) => ({ name: `--paint-${id}`, value: day })),
    { name: "--page-text", value: "#000000" },
  ];
  for (const { name, value } of properties) {
    CSS.registerProperty({ name, syntax: "<color>", inherits: true, initialValue: value });
  }
  document.documentElement.style.transitionProperty = properties.map(({ name }) => name).join(", ");
}

function applyTheme() {
  const root = document.documentElement;
  root.dataset.theme = isNight ? "night" : "day";
  for (const { id, day, night } of colors) {
    const property = `--paint-${id}`;
    root.style.setProperty(property, isNight ? night : day);
  }
  themeToggle.setAttribute("aria-checked", String(isNight));
  themeToggle.title = isNight ? "Switch to day mode" : "Switch to night mode";
}
themeToggle.addEventListener("click", () => {
  isNight = !isNight;
  applyTheme();
});
applyTheme();

let visible = false;
let frame = 0;
let sectionTop = 0;
const maxDepth = Math.max(...layers.map(({ depth }) => depth));
let lastSceneHeight = -1;

function resetMotion() {
  for (const layer of layers) {
    if (layer.lastOffset === 0 && layer.lastOffsetX === 0) continue;
    layer.wrapper.removeAttribute("transform");
    layer.lastOffset = 0;
    layer.lastOffsetX = 0;
  }
}

function clearNativeMotion() {
  for (const layer of layers) {
    layer.animation?.cancel();
    layer.animation = null;
  }
}

function syncNativeMotion() {
  clearNativeMotion();
  if (!scrollTimeline || motionPreference.matches) return;
  for (const layer of layers) {
    // The nearest layer stays in native document flow without an animation.
    if (layer.travelX === 0 && layer.travelY === 0) continue;
    // Prepare effects on resize, before any scroll input. Individual translate
    // preserves the source rendering and keeps the first scroll frame in sync.
    layer.animation = layer.wrapper.animate([
      { transform: "translate(0px, 0px)" },
      { transform: `translate(${layer.travelX}px, ${layer.travelY}px)` },
    ], {
      timeline: scrollTimeline,
      rangeStart: `${sectionTop}px`,
      rangeEnd: `${sectionTop + lastSceneHeight}px`,
      fill: "forwards",
      easing: "linear",
    });
  }
}

// Older browsers share one event-driven RAF fallback. Native scroll animations
// need neither a scroll listener nor per-frame JavaScript transform writes.
function render() {
  frame = 0;
  if (!visible || document.hidden || motionPreference.matches) return;
  const distance = Math.max(0, window.scrollY - sectionTop);
  const scrollProgress = clamp(distance / lastSceneHeight, 0, 1);
  for (const layer of layers) {
    const offsetY = scrollProgress * layer.travelY;
    const offsetX = scrollProgress * layer.travelX;
    if (offsetY === layer.lastOffset && offsetX === layer.lastOffsetX) continue;
    if (offsetY === 0 && offsetX === 0) layer.wrapper.removeAttribute("transform");
    else layer.wrapper.setAttribute("transform", `translate(${offsetX} ${offsetY})`);
    layer.lastOffset = offsetY;
    layer.lastOffsetX = offsetX;
  }
}

function schedule() {
  if (document.hidden || motionPreference.matches) return;
  if (scrollTimeline) return;
  if (!frame && visible) {
    frame = requestAnimationFrame(render);
  }
}

function stop() {
  cancelAnimationFrame(frame);
  frame = 0;
}

let lastMeasuredSize = null;
function measure(force = false) {
  const top = section.getBoundingClientRect().top + window.scrollY;
  const { width, height } = stage.getBoundingClientRect();
  if (!force && lastMeasuredSize && lastMeasuredSize.width === width && lastMeasuredSize.height === height && lastMeasuredSize.top === top) return;
  lastMeasuredSize = { width, height, top };
  sectionTop = top;
  arrange(width, height);
  lastSceneHeight = height;
  // Cache the full scene travel once per resize, in SVG units. Native
  // scrolling supplies the common upward movement; far layers compensate.
  const travel = maxDepth > 0 ? visibleSceneHeight / maxDepth : 0;
  for (const layer of layers) {
    const parallaxY = -travel * layer.depth;
    layer.travelX = -parallaxY * layer.driftDirection * cloudDrift;
    layer.travelY = maxDepth > 0 && layer.depth !== maxDepth ? visibleSceneHeight + parallaxY : 0;
  }
  syncNativeMotion();
  schedule();
}

if (!scrollTimeline) {
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    if (visible) schedule();
    else stop();
  }).observe(stage);
  window.addEventListener("scroll", schedule, { passive: true });
}

new ResizeObserver(() => measure()).observe(stage);
document.addEventListener("visibilitychange", () => document.hidden ? stop() : schedule());
motionPreference.addEventListener("change", () => {
  stop();
  if (motionPreference.matches) resetMotion();
  measure(true);
});
measure();
})();
