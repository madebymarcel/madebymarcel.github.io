<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660">
  <title>Top-down Tyrannosaurus rex</title>
  <desc>Stylized overhead anatomy with a massive skull, short two-fingered forelimbs, muscular hind limbs and a tapering tail.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#54734e"/>
      <stop offset=".48" stop-color="#91aa75"/>
      <stop offset="1" stop-color="#54734e"/>
    </linearGradient>
    <g id="forelimb" fill="#69885a" stroke="#344e35" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 173,199 C 162,185 150,181 142,186 Q 135,190 133,179 L 130,163
        Q 128,156 124,158 Q 120,160 122,169 L 123,175
        L 116,166 Q 111,162 109,166 Q 107,170 113,177 L 124,192
        Q 133,204 146,203 L 162,213 Z"/>
    </g>
    <g id="hindlimb" stroke="#344e35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path fill="#62835a" d="M 175,284 C 154,261 128,267 113,291
        C 98,310 98,335 111,348 Q 127,362 149,348
        C 168,337 184,318 187,301 Z"/>
      <path fill="#739161" d="M 122,332 Q 103,326 100,308 L 94,280
        Q 90,266 79,259 L 64,246 Q 60,241 64,238 Q 68,235 74,241 L 86,251
        L 78,229 Q 76,222 81,221 Q 86,220 88,226 L 99,248
        L 103,229 Q 105,223 109,225 Q 113,227 112,234 L 112,258
        Q 118,266 116,278 L 125,298 Q 136,310 134,323 Q 131,331 122,332 Z"/>
      <path fill="none" stroke="#486540" opacity=".8" d="M 110,285 Q 113,306 124,315 M 126,292 Q 146,282 158,295"/>
      <path fill="#d0c6a0" stroke="none" d="M 60,241 Q 58,237 62,236 L 66,238 Z M 78,225 Q 77,219 81,219 L 84,222 Z M 104,227 Q 105,222 109,223 L 111,226 Z"/>
    </g>
  </defs>
  <!-- Paired limbs, behind the neck and trunk. -->
  <use href="#forelimb"/>
  <use href="#forelimb" transform="translate(420 0) scale(-1 1)"/>
  <use href="#hindlimb"/>
  <use href="#hindlimb" transform="translate(420 0) scale(-1 1)"/>
  <!-- Neck, trunk, hips and tail form one continuous dorsal silhouette. -->
  <path fill="url(#body)" stroke="#344e35" stroke-width="3" stroke-linejoin="round"
    d="M 184,131 C 179,160 166,181 163,204
      C 158,231 151,249 148,279 C 145,311 158,340 178,357
      C 190,369 192,390 191,416 C 189,471 207,520 250,553
      C 280,576 319,598 340,634
      C 345,643 350,643 346,631 C 333,585 299,560 274,535
      C 242,502 232,458 233,416 C 234,389 234,369 244,357
      C 265,338 276,308 272,279 C 269,249 262,231 257,204
      C 254,181 241,160 236,131 Z"/>
  <path fill="#a5b986" opacity=".48" d="M 202,151
    C 191,195 179,232 178,270 C 176,311 195,344 207,357
    C 220,342 243,312 242,270 C 241,232 229,195 218,151 Z"/>
  <path fill="none" stroke="#486540" stroke-width="2" stroke-linecap="round" opacity=".65"
    d="M 210,166 C 207,210 211,255 210,298 C 208,351 211,383 212,423
      C 213,482 240,524 271,549 C 300,574 328,600 342,631"/>
  <g fill="#486540" opacity=".48">
    <path d="M 175,222 Q 190,230 204,227 Q 190,240 171,236 Z"/>
    <path d="M 245,222 Q 230,230 216,227 Q 230,240 249,236 Z"/>
    <path d="M 161,256 Q 181,267 202,264 Q 180,279 158,272 Z"/>
    <path d="M 259,256 Q 239,267 218,264 Q 240,279 262,272 Z"/>
    <path d="M 159,294 Q 181,307 202,304 Q 182,319 163,311 Z"/>
    <path d="M 261,294 Q 239,307 218,304 Q 238,319 257,311 Z"/>
    <path d="M 180,336 Q 192,346 204,344 L 197,356 Q 185,351 180,336 Z"/>
    <path d="M 240,336 Q 228,346 216,344 L 223,356 Q 235,351 240,336 Z"/>
  </g>
  <!-- Broad skull with a narrower muzzle, paired eye sockets and nostrils. -->
  <path fill="url(#body)" stroke="#344e35" stroke-width="3" stroke-linejoin="round"
    d="M 178,25 Q 210,15 242,25 Q 256,30 257,46
      L 257,73 Q 257,88 268,104 Q 280,122 264,141
      Q 247,159 210,162 Q 173,159 156,141 Q 140,122 152,104
      Q 163,88 163,73 L 163,46 Q 164,30 178,25 Z"/>
  <path fill="#a9bc89" opacity=".55" d="M 185,36 Q 210,28 235,36
    L 241,75 Q 240,104 229,123 Q 210,135 191,123 Q 180,104 179,75 Z"/>
  <g fill="#344e35">
    <ellipse cx="179" cy="46" rx="5" ry="3" transform="rotate(-18 179 46)"/>
    <ellipse cx="241" cy="46" rx="5" ry="3" transform="rotate(18 241 46)"/>
    <path d="M 161,94 Q 173,86 185,94 Q 179,108 166,108 Q 159,103 161,94 Z"/>
    <path d="M 259,94 Q 247,86 235,94 Q 241,108 254,108 Q 261,103 259,94 Z"/>
  </g>
  <g fill="#e0bf70">
    <ellipse cx="171" cy="98" rx="4" ry="2.5"/>
    <ellipse cx="249" cy="98" rx="4" ry="2.5"/>
  </g>
  <g fill="none" stroke="#486540" stroke-width="2.5" stroke-linecap="round">
    <path d="M 161,87 Q 173,78 187,89 M 259,87 Q 247,78 233,89"/>
    <path d="M 158,121 Q 168,138 187,144 M 262,121 Q 252,138 233,144"/>
    <path d="M 210,39 Q 207,66 210,84"/>
  </g>
</svg>
