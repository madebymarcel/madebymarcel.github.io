<section class="content-page ds-stack">
  <h1>T. rex</h1>
  <p>A spatial balance and walking experiment. Both views follow the same physical skeleton.</p>
  <div class="ds-card ds-stack">
    <div class="ds-cluster">
      <button class="ds-button" (click)="toggleTraining()">
        {{training()?'Pause training':'Start training'}}
      </button>
      <button class="ds-button ds-button--secondary" (click)="play()">Watch learned demo</button>
      <button class="ds-button ds-button--secondary" [disabled]="!best()" (click)="play(best()!)">
        Watch your best
      </button>
      @if(playing()){<button class="ds-button" (click)="stopReplay()">Stop replay</button>}
    </div>
    <p>Your training · {{iteration()}} candidates evaluated</p>
    @if(overhead().length){
    <svg
      class="artwork"
      viewBox="0 0 420 650"
      role="img"
      aria-label="Tyrannosaurus rex walking, seen from above"
    >
      @for(b of overhead();track b.name){
      <path
        [attr.data-bone]="b.name"
        [attr.d]="b.outline"
        [attr.fill]="b.fill"
        stroke="#3b5038"
        stroke-width="1"
        stroke-linejoin="round"
      />
      }
    </svg>
    <svg
      class="artwork side-rig"
      viewBox="0 0 420 185"
      role="img"
      aria-label="Side view of the physical skeleton"
    >
      <path d="M 0 171 H 420" stroke="currentColor" />
      @for(b of side();track b.name){
      <path
        [attr.data-bone]="b.name"
        [attr.d]="b.d"
        [attr.stroke]="b.fill"
        [attr.stroke-width]="b.width"
        stroke-linecap="round"
      />
      }
    </svg>
    } @else {
    <img
      class="artwork"
      src="trex.svg"
      alt="Tyrannosaurus rex seen from above"
      width="420"
      height="660"
    />
    }
    <p>{{status()}}</p>
  </div>
</section>
