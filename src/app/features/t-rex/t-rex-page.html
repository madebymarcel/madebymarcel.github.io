<section class="content-page rex-stage">
  <h1>T. rex</h1>
  <div class="viewer" role="group" aria-label="Physical replay" [attr.data-replay-cycle]="cycle()">
    <div class="projection">
      <svg
        class="artwork"
        viewBox="0 0 650 260"
        role="img"
        aria-label="Tyrannosaurus rex seen from above"
      >
        <defs>
          <pattern
            id="rex-track"
            patternUnits="userSpaceOnUse"
            width="420"
            height="72.5"
            [attr.y]="distance()*145"
          >
            <path d="M12 36h12 M396 36h12" stroke="currentColor" opacity=".4" />
          </pattern>
          <linearGradient id="rex-skin" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#54734e" />
            <stop offset=".48" stop-color="#91aa75" />
            <stop offset="1" stop-color="#54734e" />
          </linearGradient>
        </defs>
        <g transform="translate(650 -80) rotate(90)">
          <rect width="420" height="650" fill="url(#rex-track)" />
          <path
            data-testid="rex-tail-skin"
            [attr.d]="overhead().tail"
            fill="url(#rex-skin)"
            stroke="#344e35"
            stroke-width="2"
          />
          @for (b of overhead().segments; track b.name) { @if (!b.name.startsWith('tail-')) {
          <path
            [attr.data-bone]="b.name"
            [attr.d]="b.skin"
            [attr.fill]="b.name.startsWith('thigh') || b.name === 'trunk' || b.name === 'skull' ? 'url(#rex-skin)' : b.fill"
            stroke="#344e35"
            stroke-width=".8"
            stroke-linejoin="round"
          />
          @for (eye of b.eyes; track $index) {
          <circle [attr.cx]="eye[0]" [attr.cy]="eye[1]" r="3.4" fill="#263524" />
          <circle [attr.cx]="eye[0]" [attr.cy]="eye[1]" r="1.7" fill="#e0bf70" />
          } } }
        </g>
      </svg>
    </div>
    <div class="projection">
      <svg
        class="artwork side-rig"
        viewBox="0 0 420 210"
        role="img"
        aria-label="Side view of the physical skeleton"
      >
        <path d="M 0 195 H 420" stroke="currentColor" opacity=".35" />
        <path data-testid="rex-side-skin" [attr.d]="side().tail" fill="#77965c" stroke="#344e35" />
        @for (b of side().segments; track b.name) { @if (!b.name.startsWith('tail-')) {
        <path
          [attr.data-bone]="b.name"
          [attr.d]="b.d"
          [attr.stroke]="b.fill"
          [attr.stroke-width]="b.width"
          stroke-linecap="round"
        />
        } }
      </svg>
    </div>
  </div>
  <div class="training-control">
    <button class="ds-button" type="button" (click)="toggleTraining()" [disabled]="!ready()">
      {{ training() ? 'Pause training' : 'Start training' }}
    </button>
    <p class="milestone" role="status">{{ notice() }}</p>
    @if (error()) {
    <p class="ds-error" role="alert">{{ error() }}</p>
    }
  </div>
</section>
