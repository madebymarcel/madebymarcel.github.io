<header #header class="site-header">
  <div class="header-inner">
    <a class="wordmark" routerLink="/" (click)="onNavigate()"
      >made<span>by</span>marcel<span class="wordmark-dot">.</span></a
    >
    <button
      #menuButton
      class="ds-button ds-button--secondary menu-toggle"
      type="button"
      aria-haspopup="dialog"
      aria-controls="header-actions"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close' : 'Menu'"
      (click)="toggleMenu()"
    >
      <span class="menu-icon" [class.menu-icon--close]="menuOpen()" aria-hidden="true"
        ><span></span><span></span
      ></span>
      <span class="menu-label" aria-hidden="true">
        <span class="menu-label-menu">Menu</span>
        <span class="menu-label-close">Close</span>
      </span>
    </button>
    <div class="header-actions">
      <ng-container [ngTemplateOutlet]="navigationActions" />
    </div>
  </div>
</header>

<dialog #drawer id="header-actions" class="navigation-drawer" aria-label="Menu">
  <div class="drawer-content">
    <ng-container [ngTemplateOutlet]="navigationActions" />
  </div>
</dialog>

<ng-template #navigationActions>
  <nav aria-label="Primary">
    @for (item of navigation; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      (click)="onNavigate()"
      >{{ item.label }}</a
    >
    }
  </nav>
  <button
    class="ds-button ds-button--secondary theme-toggle"
    type="button"
    [attr.aria-pressed]="theme.mode() === 'dark'"
    (click)="theme.toggle()"
  >
    Dark mode
  </button>
</ng-template>
